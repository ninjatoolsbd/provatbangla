name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          MY_SUPABASE_URL: ${{ secrets.MY_SUPABASE_URL }}
          MY_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MY_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MY_SUPABASE_URL: ${{ secrets.MY_SUPABASE_URL }}
          VITE_MY_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MY_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "Checking build environment..."
          if [ -z "$MY_SUPABASE_URL" ]; then echo "Error: MY_SUPABASE_URL is not set"; exit 1; fi
          if [ -z "$MY_SUPABASE_PUBLISHABLE_KEY" ]; then echo "Error: MY_SUPABASE_PUBLISHABLE_KEY is not set"; exit 1; fi
          npm run build

      - name: Verify build artifacts
        run: |
          echo "Checking dist directory structure..."
          ls -R dist/
          if [ ! -f "dist/server/wrangler.json" ]; then
            echo "Error: dist/server/wrangler.json not found. Build might have failed to target Cloudflare."
            exit 1
          fi

      - name: Upload runtime secrets to Cloudflare
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          echo "Processing runtime secrets..."
          node -e '
            const all = JSON.parse(process.env.SECRETS_JSON);
            const keep = k => /^(MY_SUPABASE_|R2_|GEMINI_|OPENROUTER_)/.test(k);
            const out = {};
            let count = 0;
            for (const [k, v] of Object.entries(all)) {
              if (keep(k) && v && v !== "***") {
                out[k] = v;
                count++;
              }
            }
            if (count === 0) {
              console.error("Error: No valid secrets found to upload. Check GitHub Secrets configuration.");
              process.exit(1);
            }
            require("fs").writeFileSync("runtime-secrets.json", JSON.stringify(out));
            console.log("Found " + count + " secrets to upload.");
          '
          echo "Uploading secrets to Cloudflare..."
          npx wrangler@latest secret bulk runtime-secrets.json
          rm -f runtime-secrets.json

      - name: Deploy to Cloudflare
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Starting deployment..."
          npx wrangler@latest deploy --debug

