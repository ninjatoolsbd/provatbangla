name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          MY_SUPABASE_URL: ${{ secrets.MY_SUPABASE_URL }}
          MY_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MY_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Upload runtime secrets to Cloudflare
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          node -e '
            const all = JSON.parse(process.env.SECRETS_JSON);
            const keep = k => /^(MY_SUPABASE_|R2_|GEMINI_|OPENROUTER_)/.test(k);
            const out = {};
            for (const [k, v] of Object.entries(all)) if (keep(k) && v) out[k] = v;
            require("fs").writeFileSync("runtime-secrets.json", JSON.stringify(out));
            console.log("uploading " + Object.keys(out).length + " secrets");
          '
          npx wrangler@latest secret bulk runtime-secrets.json
          rm -f runtime-secrets.json

      - name: Deploy
        working-directory: dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy
