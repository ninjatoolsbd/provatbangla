# Cloudflare Workers configuration for প্রভাতবাংলা
# Build command (Workers Builds): npm run build
# Deploy command: npx wrangler deploy
#
# The build writes dist/_worker.js/wrangler.json (entry + assets) and
# .wrangler/deploy/config.json, which wrangler picks up automatically.
#
# Add secrets/vars in the Cloudflare dashboard:
#   Workers & Pages → provatbangla → Settings → Variables
# Required secrets: SUPABASE_SERVICE_ROLE_KEY, R2_SECRET_ACCESS_KEY
# Required vars: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, R2_ACCOUNT_ID,
#                R2_BUCKET, R2_PUBLIC_BASE_URL, R2_ACCESS_KEY_ID,
#                GEMINI_API_KEY, OPENROUTER_API_KEY

name = "provatbangla"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]
